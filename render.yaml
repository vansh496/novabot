# Render blueprint - repo connect karte hi ye service ban jayegi.
# Env vars jinhen apne dashboard se bharna hoga (sync: false) wahi hain
# jo .env.example mein hain.
services:
  - type: web
    name: novabot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # Flask session ke liye (ek baar generate ho jaye, baar baar change nahi)
      - key: SECRET_KEY
        generateValue: true
      # --- Discord (Developer Portal) ---
      - key: DISCORD_TOKEN
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      # --- Dashboard OAuth2 ---
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      # Deploy ke baad Render ke URL ke saath badalna hoga
      - key: REDIRECT_URI
        sync: false
      - key: DASHBOARD_URL
        sync: false
